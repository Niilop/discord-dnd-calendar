name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Image build and deploy only run when started by hand (Actions → CI/CD →
  # Run workflow) until hosting is decided; pushes only run the checks above.
  image:
    name: Build and push image
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Image name (GHCR requires lowercase)
        id: name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.name.outputs.name }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Immutable image reference
        id: ref
        run: echo "image=${{ steps.name.outputs.name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Hetzner
    needs: image
    runs-on: ubuntu-latest
    # Add protection rules (required reviewers, branch restriction) to this environment in repo settings.
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/opt/dnd-calendar' }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH (pinned host key, no TOFU)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Upload compose file and scripts
        run: |
          tar czf - docker-compose.yml .env.example scripts deploy \
            | ssh deploy-target "mkdir -p '$APP_DIR' && tar xzf - -C '$APP_DIR'"

      - name: Log in to GHCR on the server (job-scoped token)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | ssh deploy-target "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy (backup, migrate, restart, verify health)
        run: ssh deploy-target "'$APP_DIR/scripts/deploy.sh' '${{ needs.image.outputs.image }}'"

      - name: Log out of GHCR on the server
        if: always()
        run: ssh deploy-target "docker logout ghcr.io" || true
